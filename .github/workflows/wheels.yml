name: Python wheels

# Builds the Python package's sdist and one wheel per CPython (3.10 to 3.14),
# checks each wheel's linkage (python/check_wheel.py), installs it into a
# fresh environment with plain pip and runs python/tests against it. Then the
# same for the PyTorch package (python-torch/): one py3-none wheel, tested
# with the newest torch and, on macOS 14, the oldest it supports.
#
# On a pull request this only checks that the package builds. The Release
# workflow calls it at the new tag and publishes what it built to PyPI.
#
# The wheels are tagged macosx_14_0_arm64, the oldest macOS the mlx wheels
# support. They link the libmlx of the exact `mlx` release pinned in
# pyproject.toml, which pip installs beside them.

on:
  pull_request:
    paths:
      - "pyproject.toml"
      - "CMakeLists.txt"
      - "cmake/**"
      - "include/**"
      - "src/**"
      - "shaders/**"
      - "python/**"
      - "python-torch/**"
      - ".github/workflows/wheels.yml"
  workflow_dispatch:
  workflow_call:
    inputs:
      ref:
        description: "The tag or commit to build"
        type: string
        required: true

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-15
    env:
      MACOSX_DEPLOYMENT_TARGET: "14.0"
      PYTHONS: "3.10 3.11 3.12 3.13 3.14"
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.ref }}

      - uses: astral-sh/setup-uv@v6

      - name: Build the sdist, then every wheel from it
        run: |
          uv build --sdist --out-dir dist
          for py in $PYTHONS; do
            uv build dist/*.tar.gz --wheel --python "$py" --out-dir dist
          done
          ls -l dist

      - name: Check the wheels
        run: python3 python/check_wheel.py dist/*.whl

      - name: Install each wheel with pip and test it
        run: |
          cp -r python/tests "$RUNNER_TEMP/tests"
          for py in $PYTHONS; do
            uv venv --seed --python "$py" "$RUNNER_TEMP/venv-$py"
            # The wheel by its file, so that PyPI's copy of a version is never taken instead.
            "$RUNNER_TEMP/venv-$py/bin/pip" install dist/*-cp${py/./}-*.whl
            # Outside the checkout, so that the installed package is the one tested.
            (cd "$RUNNER_TEMP" && "$RUNNER_TEMP/venv-$py/bin/python" -c \
              "import metal_linalg as ml, mlx.core as mx; print(ml.__version__, mx.__version__, mx.metal.is_available() and ml.device_name())" \
              && "$RUNNER_TEMP/venv-$py/bin/python" -m unittest discover -s tests -v)
          done

      - uses: actions/upload-artifact@v4
        with:
          name: python-dist
          path: dist/
          if-no-files-found: error

  oldest-macos:
    # The wheels are tagged macOS 14; this installs one there and runs the
    # tests, so a shader or library built for a newer macOS fails here rather
    # than on a user's Mac. The Release workflow publishes only after it passes.
    needs: build
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.ref }}
      - uses: astral-sh/setup-uv@v6
      - uses: actions/download-artifact@v4
        with:
          name: python-dist
          path: dist/
      - name: Install a wheel on macOS 14 and test it
        run: |
          sw_vers
          uv venv --seed --python 3.12 "$RUNNER_TEMP/venv"
          "$RUNNER_TEMP/venv/bin/pip" install dist/*-cp312-*.whl
          cp -r python/tests "$RUNNER_TEMP/tests"
          cd "$RUNNER_TEMP"
          "$RUNNER_TEMP/venv/bin/python" -c "import metal_linalg as ml, mlx.core as mx; print(ml.__version__, mx.__version__, mx.metal.is_available() and ml.device_name())"
          "$RUNNER_TEMP/venv/bin/python" -m unittest discover -s tests -v

  torch:
    # The PyTorch package: one wheel for every Python and every torch, since
    # it loads the library with ctypes and is compiled against neither.
    runs-on: macos-15
    env:
      MACOSX_DEPLOYMENT_TARGET: "14.0"
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.ref }}

      - uses: astral-sh/setup-uv@v6

      - name: Build the wheel
        run: |
          uv build python-torch --wheel --out-dir dist-torch
          ls -l dist-torch

      - name: Check the wheel
        run: python3 python-torch/check_wheel.py dist-torch/*.whl

      - name: Install it with pip beside the newest torch and test it
        run: |
          cp -r python-torch/tests "$RUNNER_TEMP/torch-tests"
          for py in 3.10 3.14; do
            uv venv --seed --python "$py" "$RUNNER_TEMP/tvenv-$py"
            "$RUNNER_TEMP/tvenv-$py/bin/pip" install dist-torch/*.whl
            (cd "$RUNNER_TEMP" && "$RUNNER_TEMP/tvenv-$py/bin/python" -c \
              "import metal_linalg_torch as mlt, torch; print(mlt.__version__, torch.__version__, torch.backends.mps.is_available(), mlt.device_name())" \
              && "$RUNNER_TEMP/tvenv-$py/bin/python" -m unittest discover -s torch-tests -v)
          done

      - uses: actions/upload-artifact@v4
        with:
          name: python-torch-dist
          path: dist-torch/
          if-no-files-found: error

  torch-oldest:
    # The wheel on macOS 14 with torch 2.4, the oldest torch it supports.
    needs: torch
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.ref }}
      - uses: astral-sh/setup-uv@v6
      - uses: actions/download-artifact@v4
        with:
          name: python-torch-dist
          path: dist-torch/
      - name: Install the wheel with torch 2.4 on macOS 14 and test it
        run: |
          sw_vers
          uv venv --seed --python 3.12 "$RUNNER_TEMP/venv"
          "$RUNNER_TEMP/venv/bin/pip" install dist-torch/*.whl "torch==2.4.1" "numpy<2"
          cp -r python-torch/tests "$RUNNER_TEMP/torch-tests"
          cd "$RUNNER_TEMP"
          "$RUNNER_TEMP/venv/bin/python" -c "import metal_linalg_torch as mlt, torch; print(mlt.__version__, torch.__version__, mlt.device_name())"
          # CPU tensors only: on these virtual Macs torch 2.4's MPS reports itself
          # available, then fails to allocate a few hundred bytes. (The suite passes
          # with MPS and torch 2.4 on real hardware; the job above covers MPS.)
          METAL_LINALG_TEST_NO_MPS=1 "$RUNNER_TEMP/venv/bin/python" -m unittest discover -s torch-tests -v
